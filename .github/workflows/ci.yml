# Everything the CLAUDE.md checklist asks for before finishing, enforced on every push.
# Until this existed the only workflow in the repository built the demo, so no test ran
# anywhere except on a developer's machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run test:unit
        working-directory: web

  hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hook is plain sh, reached by neither go test nor Playwright.
      - run: sh integrations/claude-code/wt-hook_test.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # The suite runs against the embedded build, so the binary has to be rebuilt
      # here or Playwright would test a stale UI.
      - run: make build
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
