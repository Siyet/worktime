name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer tag (for example v1.2.3)
        required: true
        type: string
      generation:
        description: Monotonically increasing signed-manifest generation
        required: true
        type: string

permissions: {}

concurrency:
  group: worktime-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish immutable release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      GENERATION: ${{ inputs.generation }}
      SOURCE_SHA: ${{ github.sha }}
      IMAGE: ghcr.io/siyet/worktime
      GOTOOLCHAIN: local
    steps:
      # v6. Every external action is pinned to a full commit revision.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.25.1"
          cache: true

      # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Prove exact main release prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Siyet/worktime"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GENERATION" =~ ^[1-9][0-9]*$ ]]
          node -e 'const generation=Number(process.env.GENERATION); if(!Number.isSafeInteger(generation)||generation<1) process.exit(1)'

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists" >&2
            exit 1
          fi

      - name: Run full validation gates
        shell: bash
        run: |
          set -euo pipefail
          unset VERSION
          npm ci --no-fund --no-audit --prefix web
          npm run build --prefix web
          go vet ./...
          go test ./...
          npm run check --prefix web
          npm run test:unit --prefix web
          dash integrations/claude-code/wt-hook_test.sh
          bash integrations/claude-code/wt-hook_test.sh
          dash integrations/claude-code/wt-statusline_test.sh
          bash integrations/claude-code/wt-statusline_test.sh
          (cd web && npx playwright install --with-deps chromium)
          make build
          (cd web && npx playwright test)

      # v4.1.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # v3.7.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      # v3.12.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # v4.1.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Build and verify native artifacts
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "BUILT_AT=$BUILT_AT" >> "$GITHUB_ENV"
          mkdir -p dist
          VITE_WORKTIME_VERSION="$VERSION" npm run build --prefix web
          ldflags="-s -w -X github.com/Siyet/worktime/internal/buildinfo.Version=$VERSION -X github.com/Siyet/worktime/internal/buildinfo.Revision=$SOURCE_SHA -X github.com/Siyet/worktime/internal/buildinfo.BuiltAt=$BUILT_AT -X github.com/Siyet/worktime/internal/buildinfo.Packaging=native"
          for architecture in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$architecture" go build -trimpath \
              -ldflags "$ldflags" -o "dist/worktime-linux-$architecture" ./cmd/worktime
            "dist/worktime-linux-$architecture" --version | grep -Fqx "worktime $VERSION (revision $SOURCE_SHA, built $BUILT_AT)"
            check_dir="$(mktemp -d)"
            WORKTIME_DB="$check_dir/worktime.db" WORKTIME_UPDATE_CHECKS=0 \
              "dist/worktime-linux-$architecture" --update-self-check
            rm -rf "$check_dir"
          done

      - name: Resolve existing container image tag
        id: container-image
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/ghcr-tag-check

      - name: Build and push multi-platform image
        if: steps.container-image.outputs.exists == 'false'
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --progress=plain \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$SOURCE_SHA" \
            --build-arg "BUILT_AT=$BUILT_AT" \
            --tag "$IMAGE:$VERSION" \
            --push --metadata-file dist/image-metadata.json .
          IMAGE_DIGEST="$(node -e 'const m=require("./dist/image-metadata.json"); const d=m["containerimage.digest"]; if(!/^sha256:[0-9a-f]{64}$/.test(d)) process.exit(1); process.stdout.write(d)')"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Sign multi-platform image
        if: steps.container-image.outputs.exists == 'false'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
          cosign verify \
            --certificate-identity "https://github.com/Siyet/worktime/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$SOURCE_SHA" \
            "$IMAGE@$IMAGE_DIGEST"

      - name: Verify and reuse signed multi-platform image
        if: steps.container-image.outputs.exists == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          EXPECTED_IMAGE_DIGEST: ${{ steps.container-image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/Siyet/worktime/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$SOURCE_SHA" \
            "$IMAGE@$EXPECTED_IMAGE_DIGEST"
          go run ./cmd/ghcr-tag-check
          echo "IMAGE_DIGEST=$EXPECTED_IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Enforce manifest generation and create signed manifest
        shell: bash
        run: |
          set -euo pipefail
          latest_status="$(curl --silent --show-error --location --output "$RUNNER_TEMP/latest-manifest.json" --write-out '%{http_code}' \
            "https://github.com/Siyet/worktime/releases/latest/download/release-manifest.json")"
          if test "$latest_status" = 200; then
            curl --fail --silent --show-error --location \
              --output "$RUNNER_TEMP/latest-manifest.sigstore.json" \
              "https://github.com/Siyet/worktime/releases/latest/download/release-manifest.sigstore.json"
            cosign verify-blob \
              --bundle "$RUNNER_TEMP/latest-manifest.sigstore.json" \
              --certificate-identity "https://github.com/Siyet/worktime/.github/workflows/release.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$RUNNER_TEMP/latest-manifest.json"
            previous_generation="$(node -e 'const m=require(process.argv[1]); if(!Number.isSafeInteger(m.generation)||m.generation<1) process.exit(1); process.stdout.write(String(m.generation))' "$RUNNER_TEMP/latest-manifest.json")"
            test "$GENERATION" -gt "$previous_generation"
            previous_version="$(node -e 'const m=require(process.argv[1]); if(m.schema_version!==1||typeof m.version!=="string"||!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(m.version)) process.exit(1); process.stdout.write(m.version)' "$RUNNER_TEMP/latest-manifest.json")"
            node -e '
              const parse = value => value.slice(1).split(".").map(BigInt);
              const previous = parse(process.argv[1]);
              const next = parse(process.argv[2]);
              const greater = next[0] > previous[0] ||
                (next[0] === previous[0] && next[1] > previous[1]) ||
                (next[0] === previous[0] && next[1] === previous[1] && next[2] > previous[2]);
              if (!greater) process.exit(1);
            ' "$previous_version" "$VERSION"
          elif test "$latest_status" != 404; then
            echo "Cannot establish previous signed manifest generation (HTTP $latest_status)" >&2
            exit 1
          fi

          export PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const assets = ['amd64', 'arm64'].map(arch => {
            const name = `worktime-linux-${arch}`;
            const bytes = fs.readFileSync(`dist/${name}`);
            return {
              os: 'linux', arch, name,
              url: `https://github.com/Siyet/worktime/releases/download/${process.env.VERSION}/${name}`,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              size: bytes.length,
            };
          });
          const manifest = {
            schema_version: 1,
            generation: Number(process.env.GENERATION),
            version: process.env.VERSION,
            revision: process.env.SOURCE_SHA,
            published_at: process.env.PUBLISHED_AT,
            changelog_url: `https://github.com/Siyet/worktime/releases/tag/${process.env.VERSION}`,
            image: {name: process.env.IMAGE, digest: process.env.IMAGE_DIGEST},
            assets,
          };
          fs.writeFileSync('dist/release-manifest.json', JSON.stringify(manifest) + '\n');
          NODE
          cosign sign-blob --yes \
            --bundle dist/release-manifest.sigstore.json \
            dist/release-manifest.json
          cosign verify-blob \
            --bundle dist/release-manifest.sigstore.json \
            --certificate-identity "https://github.com/Siyet/worktime/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/release-manifest.json

      - name: Create, verify, and publish immutable draft
        shell: bash
        run: |
          set -euo pipefail
          release_id_file="$RUNNER_TEMP/worktime-release-id"
          cleanup_armed=true
          cleanup() {
            status=$?
            if test "$cleanup_armed" = true && test -s "$release_id_file"; then
              release_id="$(cat "$release_id_file")"
              release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" 2>/dev/null || true)"
              if test -n "$release_json" && \
                 test "$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(String(String(r.id)===process.argv[2] && r.immutable===false && r.tag_name===process.env.VERSION && r.target_commitish===process.env.SOURCE_SHA))' "$release_json" "$release_id")" = true; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
                tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha' 2>/dev/null || true)"
                if test "$tag_sha" = "$SOURCE_SHA"; then
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION"
                fi
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          release_json="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$VERSION" -f "target_commitish=$SOURCE_SHA" \
            -f "name=WorkTime $VERSION" -F draft=true -F prerelease=false \
            -F generate_release_notes=true)"
          node -e 'const r=JSON.parse(process.argv[1]); if(!r.draft||r.tag_name!==process.env.VERSION||r.target_commitish!==process.env.SOURCE_SHA) process.exit(1); process.stdout.write(String(r.id))' \
            "$release_json" > "$release_id_file"

          gh release upload "$VERSION" \
            dist/worktime-linux-amd64 \
            dist/worktime-linux-arm64 \
            dist/release-manifest.json \
            dist/release-manifest.sigstore.json
          mkdir "$RUNNER_TEMP/downloaded"
          gh release download "$VERSION" --dir "$RUNNER_TEMP/downloaded"
          chmod 0755 \
            "$RUNNER_TEMP/downloaded/worktime-linux-amd64" \
            "$RUNNER_TEMP/downloaded/worktime-linux-arm64"
          for asset in worktime-linux-amd64 worktime-linux-arm64 release-manifest.json release-manifest.sigstore.json; do
            cmp "dist/$asset" "$RUNNER_TEMP/downloaded/$asset"
          done
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/downloaded/release-manifest.sigstore.json" \
            --certificate-identity "https://github.com/Siyet/worktime/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/downloaded/release-manifest.json"
          "$RUNNER_TEMP/downloaded/worktime-linux-amd64" --version | grep -Fqx "worktime $VERSION (revision $SOURCE_SHA, built $BUILT_AT)"
          "$RUNNER_TEMP/downloaded/worktime-linux-arm64" --version | grep -Fqx "worktime $VERSION (revision $SOURCE_SHA, built $BUILT_AT)"

          release_id="$(cat "$release_id_file")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false >/dev/null

          release_attestation_verified=false
          for attempt in {1..30}; do
            if verification_output="$(gh release verify "$VERSION" 2>&1)"; then
              printf '%s\n' "$verification_output"
              release_attestation_verified=true
              break
            fi
            case "$verification_output" in
              *"no attestations for tag"*|*"no attestations found for release"*) ;;
              *)
                printf '%s\n' "$verification_output" >&2
                exit 1
                ;;
            esac
            if test "$attempt" -eq 30; then
              printf 'GitHub release attestation was not available after 5 minutes\n' >&2
              break
            fi
            sleep 10
          done
          test "$release_attestation_verified" = true
          published_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          node -e 'const r=JSON.parse(process.argv[1]); if(r.draft || !r.immutable || r.tag_name!==process.env.VERSION) process.exit(1)' "$published_json"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha')" = "$SOURCE_SHA"
          rm -rf "$RUNNER_TEMP/published-download"
          mkdir "$RUNNER_TEMP/published-download"
          gh release download "$VERSION" --dir "$RUNNER_TEMP/published-download"
          chmod 0755 \
            "$RUNNER_TEMP/published-download/worktime-linux-amd64" \
            "$RUNNER_TEMP/published-download/worktime-linux-arm64"
          for asset in worktime-linux-amd64 worktime-linux-arm64 release-manifest.json release-manifest.sigstore.json; do
            gh release verify-asset "$VERSION" "$RUNNER_TEMP/published-download/$asset"
            cmp "dist/$asset" "$RUNNER_TEMP/published-download/$asset"
          done
          cleanup_armed=false
