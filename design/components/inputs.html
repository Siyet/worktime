<!-- @dsCard group="Components" name="Inputs & selects" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WorkTime - Inputs</title>
<link rel="stylesheet" href="../_shared.css" />
<link rel="stylesheet" href="../_tags.css" />
<style>
  .pselect { position: relative; display: inline-block; }
  .pselect > button { display: inline-flex; align-items: center; gap: 0.5rem; }
  .pselect .caret { color: var(--text-dim); font-size: 0.7rem; }
  .pselect .menu { position: absolute; top: calc(100% + 4px); left: 0; min-width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.25rem; display: none; z-index: 5; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .pselect.open .menu { display: block; }
  .pselect .menu button { display: flex; align-items: center; gap: 0.5rem; width: 100%; border: none; background: transparent; text-align: left; padding: 0.35rem 0.6rem; border-radius: 5px; white-space: nowrap; }
  .pselect .menu button:hover { background: var(--hover); }
  .stack { display: flex; flex-direction: column; gap: 0.75rem; max-width: 26rem; }
</style>
</head>
<body>
  <div class="stack">
    <!-- Description field with task suggestions. The list opens on typing only,
         never on a bare focus: on a narrow screen the start form wraps to three
         rows and a popover on focus would cover the Start button. Each row shows
         the project and tags that picking it will fill in. -->
    <span class="dinput">
      <input
        value="write"
        placeholder="What are you working on?"
        role="combobox"
        aria-expanded="true"
        aria-autocomplete="list"
        aria-controls="sugg-demo"
        aria-activedescendant="sugg-demo-0"
      />
      <ul class="menu" id="sugg-demo" role="listbox" aria-label="Recent tasks">
        <li role="option" aria-selected="true">
          <button type="button" class="active" id="sugg-demo-0">
            <span class="stext">Write e2e tests</span>
            <span class="smeta muted">MySky · development</span>
          </button>
        </li>
        <li role="option" aria-selected="false">
          <button type="button" id="sugg-demo-1">
            <span class="stext">Write docs</span>
            <span class="smeta muted">MySky</span>
          </button>
        </li>
        <li role="option" aria-selected="false">
          <button type="button" id="sugg-demo-2">
            <span class="stext">Rewrite the sync engine</span>
          </button>
        </li>
      </ul>
    </span>
    <input placeholder="What are you working on?" />
    <span class="pselect" id="psel">
      <button type="button"><span class="dot" style="background: var(--accent)"></span><span class="plabel">MySky</span><span class="caret">▾</span></button>
      <span class="menu">
        <button type="button" data-c="var(--accent)"><span class="dot" style="background: var(--accent)"></span>MySky</button>
        <button type="button" data-c="var(--blue)"><span class="dot" style="background: var(--blue)"></span>PT</button>
        <button type="button" data-c="#d76a9b"><span class="dot" style="background: #d76a9b"></span>IV</button>
        <button type="button" data-c="var(--border)"><span class="dot" style="background: var(--border)"></span>No project</button>
      </span>
    </span>
    <div class="row" style="flex-wrap: wrap">
      <span class="seg"><button class="on">Vacation</button><button>Sick leave</button><button>Day off</button></span>
      <input type="date" value="2026-07-29" />
      <span class="muted">-</span>
      <input type="date" value="2026-08-05" />
    </div>
    <div class="row">
      <input type="color" value="#e8a33d" aria-label="Project color" />
      <input placeholder="New project name" style="flex: 1" />
      <button class="primary">Add</button>
    </div>
  </div>
<script>
const ps=document.getElementById('psel');
ps.querySelector(':scope > button').onclick=()=>ps.classList.toggle('open');
ps.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>{
  ps.querySelector('.plabel').textContent=b.textContent;
  ps.querySelector(':scope > button .dot').style.background=b.dataset.c;
  ps.classList.remove('open');});
document.addEventListener('click',e=>{if(!ps.contains(e.target))ps.classList.remove('open')});
</script>
</body>
</html>
