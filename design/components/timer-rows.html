<!-- @dsCard group="Components" name="Timer rows & day groups" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WorkTime - Timer rows</title>
<link rel="stylesheet" href="../_shared.css" />
<link rel="stylesheet" href="../_tags.css" />
<style>
  .elapsed { font-size: 1.05rem; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h3>Running</h3>
    <div class="row item">
      <span class="dot" style="background: var(--accent)"></span>
      <span class="main">
        <button type="button" class="desc">AIM V2 epic review</button>
        <span class="meta muted">
          <span class="proj">MySky</span>
          <span class="tags"><span class="tag">development</span></span>
        </span>
      </span>
      <span class="when">
        <span class="dur elapsed">1:42:07</span>
      </span>
      <button>Stop</button>
    </div>
    <div class="row item">
      <span class="dot" style="background: var(--border)"></span>
      <span class="main">
        <button type="button" class="desc">Code review</button>
        <span class="meta muted"></span>
      </span>
      <span class="when">
        <span class="dur elapsed">0:12:33</span>
      </span>
      <button>Stop</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <h3>Tue, Jul 29</h3>
      <span class="spacer"></span>
      <span class="muted mono">6h 40m</span>
    </div>
    <div class="row item">
      <span class="dot" style="background: var(--accent)"></span>
      <span class="main">
        <button type="button" class="desc">Доработка топологии</button>
        <span class="meta muted">
          <span class="proj">MySky</span>
          <span class="tags">
            <span class="tag">development</span>
            <span class="tag">+1</span>
          </span>
        </span>
      </span>
      <span class="when">
        <span class="dur">1h 45m</span>
        <span class="range muted"><span class="from">09:15</span><span class="to">-11:00</span></span>
      </span>
      <span class="menu-wrap">
        <button type="button" class="kebab icon" aria-label="Entry actions" aria-expanded="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="1.7" /><circle cx="12" cy="12" r="1.7" /><circle cx="12" cy="19" r="1.7" />
          </svg>
        </button>
      </span>
    </div>
    <div class="row item">
      <span class="dot" style="background: var(--blue)"></span>
      <span class="main">
        <button type="button" class="desc">Weekly</button>
        <span class="meta muted">
          <span class="proj">PT</span>
          <span class="tags"><span class="tag">meeting</span></span>
        </span>
      </span>
      <span class="when">
        <span class="dur">54m</span>
        <span class="range muted"><span class="from">11:00</span><span class="to">-11:54</span></span>
      </span>
      <span class="menu-wrap">
        <button type="button" class="kebab icon" aria-label="Entry actions" aria-expanded="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="1.7" /><circle cx="12" cy="12" r="1.7" /><circle cx="12" cy="19" r="1.7" />
          </svg>
        </button>
      </span>
    </div>
  </div>
</body>
</html>
