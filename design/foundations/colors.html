<!-- @dsCard group="Foundations" name="Colors" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WorkTime - Colors</title>
<link rel="stylesheet" href="../_shared.css" />
<style>
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
  .swatch { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .swatch .chip { height: 56px; }
  .swatch .label { padding: 0.4rem 0.6rem; font-size: 0.8rem; }
  .swatch .label code { display: block; color: var(--text-dim); font-size: 0.75rem; }
</style>
</head>
<body>
  <h3>Theme tokens (auto light/dark)</h3>
  <div class="swatches">
    <div class="swatch"><div class="chip" style="background: var(--bg)"></div><div class="label">Background<code>--bg</code></div></div>
    <div class="swatch"><div class="chip" style="background: var(--surface)"></div><div class="label">Surface<code>--surface</code></div></div>
    <div class="swatch"><div class="chip" style="background: var(--text)"></div><div class="label">Text<code>--text</code></div></div>
    <div class="swatch"><div class="chip" style="background: var(--text-dim)"></div><div class="label">Text dim<code>--text-dim</code></div></div>
    <div class="swatch"><div class="chip" style="background: var(--border)"></div><div class="label">Border<code>--border</code></div></div>
    <div class="swatch"><div class="chip" style="background: var(--accent)"></div><div class="label">Accent<code>--accent</code></div></div>
    <div class="swatch"><div class="chip" style="background: var(--danger)"></div><div class="label">Danger / sick<code>--danger</code></div></div>
    <div class="swatch"><div class="chip" style="background: var(--teal)"></div><div class="label">Vacation<code>--teal</code></div></div>
    <div class="swatch"><div class="chip" style="background: var(--purple)"></div><div class="label">Day off<code>--purple</code></div></div>
    <div class="swatch"><div class="chip" style="background: var(--green)"></div><div class="label">Holiday<code>--green</code></div></div>
  </div>
  <h3 style="margin-top: 1rem">Project colors (user-picked, examples)</h3>
  <div class="swatches">
    <div class="swatch"><div class="chip" style="background: #e8a33d"></div><div class="label">MySky</div></div>
    <div class="swatch"><div class="chip" style="background: #607dbe"></div><div class="label">PT</div></div>
    <div class="swatch"><div class="chip" style="background: #d76a9b"></div><div class="label">IV</div></div>
  </div>
</body>
</html>
