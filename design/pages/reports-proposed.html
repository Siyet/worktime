<!-- @dsCard group="Pages" name="Reports page (proposed rework)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WorkTime - Reports (proposed)</title>
<link rel="stylesheet" href="../_shared.css" />
<style>
  .shell { max-width: 46rem; margin: 0 auto; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 0.5rem; }
  .chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
  .chart .seg { border-radius: 2px 2px 0 0; }
  .chart-labels { display: flex; gap: 6px; }
  .chart-labels span { flex: 1; text-align: center; font-size: 0.7rem; color: var(--text-dim); }
  .bar { height: 4px; border-radius: 2px; margin: 0.25rem 0 0 1.2rem; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
  .kpi { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem 0.8rem; }
  .kpi .value { font-size: 1.2rem; font-weight: 700; }
  .kpi .label { font-size: 0.75rem; color: var(--text-dim); }
</style>
</head>
<body>
<div class="shell">
  <!-- Proposed functional upgrades over the current page:
       custom date range, day-by-day stacked chart, per-project filter,
       KPI tiles (total / per day / billable-free days), CSV export. -->
  <div class="card row" style="flex-wrap: wrap">
    <select><option>This week</option><option>This month</option><option>Last 30 days</option><option selected>Custom range</option></select>
    <input type="date" value="2026-07-01" />
    <span class="muted">-</span>
    <input type="date" value="2026-07-29" />
    <select><option>All projects</option><option>MySky</option><option>PT</option></select>
    <span class="spacer"></span>
    <button>Export CSV</button>
  </div>

  <div class="card kpis">
    <div class="kpi"><div class="value mono">113h 02m</div><div class="label">Total tracked</div></div>
    <div class="kpi"><div class="value mono">5h 23m</div><div class="label">Average per work day</div></div>
    <div class="kpi"><div class="value mono">3d</div><div class="label">Time off (2 vacation, 1 sick)</div></div>
  </div>

  <div class="card">
    <h3>By day</h3>
    <div class="chart">
      <div class="col"><div class="seg" style="height: 52%; background: #3f51b5"></div><div class="seg" style="height: 14%; background: #ff0000"></div></div>
      <div class="col"><div class="seg" style="height: 65%; background: #3f51b5"></div></div>
      <div class="col"><div class="seg" style="height: 40%; background: #3f51b5"></div><div class="seg" style="height: 22%; background: #ba68c8"></div></div>
      <div class="col"><div class="seg" style="height: 8%; background: #03a9f4"></div></div>
      <div class="col"></div>
      <div class="col"><div class="seg" style="height: 71%; background: #3f51b5"></div><div class="seg" style="height: 10%; background: #ff0000"></div></div>
      <div class="col"><div class="seg" style="height: 55%; background: #3f51b5"></div></div>
    </div>
    <div class="chart-labels"><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span></div>
  </div>

  <div class="card">
    <h3>By project</h3>
    <div class="item">
      <div class="row">
        <span class="dot" style="background: #3f51b5"></span><span>MySky</span>
        <span class="spacer"></span><span class="mono">89h 12m</span><span class="muted">79%</span>
      </div>
      <div class="bar" style="width: 79%; background: #3f51b5"></div>
    </div>
    <div class="item">
      <div class="row">
        <span class="dot" style="background: #ff0000"></span><span>PT</span>
        <span class="spacer"></span><span class="mono">14h 30m</span><span class="muted">13%</span>
      </div>
      <div class="bar" style="width: 13%; background: #ff0000"></div>
    </div>
    <div class="item">
      <div class="row">
        <span class="dot" style="background: #ba68c8"></span><span>IV</span>
        <span class="spacer"></span><span class="mono">9h 20m</span><span class="muted">8%</span>
      </div>
      <div class="bar" style="width: 8%; background: #ba68c8"></div>
    </div>
  </div>
</div>
</body>
</html>
